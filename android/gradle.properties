# 3G, not 8G: this build shares a 16G box with a 2.7G Android emulator and an
# editor. At -Xmx8G plus 4G metaspace the JVM reservation sent the machine into
# swap thrash and `assembleDebug` stalled for >10min without ever failing.
# Raise it on a bigger machine: make run-emulator GRADLE_OPTS=-Xmx8G
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
